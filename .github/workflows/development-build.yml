name: Development build

# Manual debug APK for sideloading onto a phone.
# Actions → Development build → Run workflow (select main, or another branch).

on:
  workflow_dispatch:

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 (API 36) SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare installable artifact
        id: artifact
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK found" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          ASSET_NAME="pledger-io-dev-${SHORT_SHA}-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$ASSET_NAME"
          echo "path=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Built $ASSET_NAME from $APK (ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA})"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pledger-dev-apk
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## Development APK ready"
            echo ""
            echo "- **Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Artifact:** \`pledger-dev-apk\` → \`${{ steps.artifact.outputs.path }}\`"
            echo ""
            echo "Download the artifact from this run's **Artifacts** section,"
            echo "then install on a phone (API 26+) after allowing install from unknown sources,"
            echo "or with \`adb install -r ${{ steps.artifact.outputs.path }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
