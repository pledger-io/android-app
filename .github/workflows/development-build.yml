name: Development build

# Manual debug APK for sideloading onto a phone.
# Actions → Development build → Run workflow (select main, or another branch).
# Builds are time-limited: the APK refuses to open after 7 days.

on:
  workflow_dispatch:

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_BUILD_VALIDITY_DAYS: "7"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 (API 36) SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Compute development build expiry
        id: expiry
        run: |
          NOW_MS=$(($(date +%s) * 1000))
          EXPIRES_AT=$((NOW_MS + DEV_BUILD_VALIDITY_DAYS * 24 * 60 * 60 * 1000))
          EXPIRES_UTC=$(date -u -d "@$((EXPIRES_AT / 1000))" '+%Y-%m-%d %H:%M:%S UTC')
          echo "expires_at_epoch_ms=$EXPIRES_AT" >> "$GITHUB_OUTPUT"
          echo "expires_at_utc=$EXPIRES_UTC" >> "$GITHUB_OUTPUT"
          echo "Development APK expires at $EXPIRES_UTC ($EXPIRES_AT)"

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --no-daemon
          -PdevBuildExpiresAtEpochMs=${{ steps.expiry.outputs.expires_at_epoch_ms }}

      - name: Prepare installable artifact
        id: artifact
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK found" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          ASSET_NAME="pledger-io-dev-${SHORT_SHA}-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$ASSET_NAME"
          echo "path=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Built $ASSET_NAME from $APK (ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA})"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pledger-dev-apk
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## Development APK ready"
            echo ""
            echo "- **Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Expires:** ${{ steps.expiry.outputs.expires_at_utc }} (${DEV_BUILD_VALIDITY_DAYS}-day limit)"
            echo "- **Artifact:** \`pledger-dev-apk\` → \`${{ steps.artifact.outputs.path }}\`"
            echo ""
            echo "Download the artifact from this run's **Artifacts** section,"
            echo "then install on a phone (API 26+) after allowing install from unknown sources,"
            echo "or with \`adb install -r ${{ steps.artifact.outputs.path }}\`."
            echo ""
            echo "After expiry the app opens only to a warning screen until you install a newer build."
          } >> "$GITHUB_STEP_SUMMARY"
